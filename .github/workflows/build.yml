name: Fixed Lazy Build Engine
on: [workflow_dispatch, push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages (Server)
        run: |
          if (Test-Path "ExtendScreenServer") {
            cd ExtendScreenServer
            nuget restore
            cd ..
          }

      - name: Build Windows Server
        run: |
          if (Test-Path "ExtendScreenServer") {
            cd ExtendScreenServer
            msbuild /p:Configuration=Release
          }

      - name: Upload Windows Server
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Server-Files
          path: 'ExtendScreenServer/**/bin/Release/'

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lowered to Java 11 which older Android Gradle builds require to prevent exit code 1
      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build Android App
        run: |
          cd ExtendScreenAndroid
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Tablet-APK
          path: ExtendScreenAndroid/app/build/outputs/apk/debug/*.apk
