name: Official README Build Engine
on: [workflow_dispatch, push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Build Windows Server
        run: |
          cd ExtendScreenServer
          dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o output

      - name: Upload Windows Server
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Server-Files
          path: ExtendScreenServer/output/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Bypasses the strict action security block by using the built-in system gradle environment directly
      - name: Build Android App
        run: |
          cd ExtendScreenAndroid
          gradle assembleDebug --no-daemon

      - name: Upload Tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Tablet-APK
          path: ExtendScreenAndroid/app/build/outputs/apk/debug/*.apk
