name: Fixed Lazy Build Engine
on: [workflow_dispatch, push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: |
          if (Test-Path "ExtendScreenServer") {
            cd ExtendScreenServer
            nuget restore
            cd ..
          }

      - name: Build Windows Server
        run: |
          if (Test-Path "ExtendScreenServer") {
            cd ExtendScreenServer
            msbuild /p:Configuration=Release
          }

      - name: Upload Windows Server
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Server-Files
          path: 'ExtendScreenServer/**/bin/Release/'

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # Dynamically injects a brand new, working Gradle environment into the VM
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.4

      # Uses the clean, newly injected global gradle command instead of the missing file
      - name: Build Android App
        run: |
          cd ExtendScreenAndroid
          gradle assembleDebug --no-daemon

      - name: Upload Tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Tablet-APK
          path: ExtendScreenAndroid/app/build/outputs/apk/debug/*.apk
