name: Lazy Build Engine
on: [workflow_dispatch, push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Windows App
        run: msbuild ExtendScreen.sln /p:Configuration=Release
      - name: Upload Windows Exe
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Server-Files
          path: '**/bin/Release/'

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Android App
        run: |
          cd ExtendScreenAndroid
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Tablet-APK
          path: ExtendScreenAndroid/app/build/outputs/apk/debug/*.apk
